[package]
name = "wartales-mp"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-4.0"
description = "Wartales direct co-op helper (master, relay, proxy-link, punch, NAT), linked into winmm.dll"

[lib]
name = "wartales_mp"
crate-type = ["rlib", "staticlib"]

[features]
# Local co-op test harness: only for shim\build.ps1 -Test, never shipped.
harness = ["wartales-tips/harness"]

[dependencies]
# Linked as an rlib: its C ABI (wartales_tips_*) ships inside this one staticlib.
wartales-tips = { path = "../patcher" }
anyhow = "1"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
kcp = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
quick-xml = "0.42"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
# unwind, not abort: every thread entry catches a panic and logs it; abort would kill the game.
panic = "unwind"
codegen-units = 1
lto = "thin"
